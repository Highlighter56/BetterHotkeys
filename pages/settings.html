<!doctype html>
<html lang="en">
		<head>
			<meta charset="utf-8">
			<meta name="viewport" content="width=device-width, initial-scale=1">
			<title>Better Hotkeys Settings</title>
			<link rel="stylesheet" href="settings.css">
		</head>
	<body>
		<main>
			<h1>Better Hotkeys</h1>

			<div class="shortcut-container">
				<button id="configure-btn" class="open-shortcuts-settings">
					<span>Configure in Chrome</span>
					<img src="/font-awsome/gears-solid-full.svg" alt="" class="btn-icon">
				</button>
			</div>

			<section class="settings-section" aria-labelledby="group-settings-heading">
				<h2 id="group-settings-heading">Group Behavior</h2>
				<label class="setting-row" for="show-group-customization">
					<strong>Show Menu On Group</strong>
					<input id="show-group-customization" type="checkbox">
				</label>
				<label class="setting-row" for="confirm-ungroup">
					<strong>Confirm Before Ungroup</strong>
					<input id="confirm-ungroup" type="checkbox">
				</label>
				<p id="settings-status" role="status" aria-live="polite"></p>
			</section>

			<section aria-labelledby="commands-heading">
				<h2 id="commands-heading">Commands</h2>
				<label class="setting-row" for="display-recommended-commands">
					<strong>Display Recommended Commands</strong>
					<input id="display-recommended-commands" type="checkbox">
				</label>

				<!-- <a target="_blank" href="chrome://extensions/shortcuts">Configure in Chrome</a> -->

				<ul id="commands" class="commands"></ul>

			</section>

		</main>
		<script type="module" src="settings.js"></script>
	</body>
</html>
